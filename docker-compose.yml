services:
  node-0:
    build: .
    environment:
      - NODE_ID=0
      - PEERS=node-1:9000,node-2:9000,node-3:9000,node-4:9000
      - RPC_PORT=9000
      - WS_PORT=8080
      - DATA_DIR=/data
    ports:
      - "8080:8080"
    volumes:
      - node0-data:/data

  node-1:
    build: .
    environment:
      - NODE_ID=1
      - PEERS=node-0:9000,node-2:9000,node-3:9000,node-4:9000
      - RPC_PORT=9000
      - WS_PORT=8080
      - DATA_DIR=/data
    ports:
      - "8081:8080"
    volumes:
      - node1-data:/data

  node-2:
    build: .
    environment:
      - NODE_ID=2
      - PEERS=node-0:9000,node-1:9000,node-3:9000,node-4:9000
      - RPC_PORT=9000
      - WS_PORT=8080
      - DATA_DIR=/data
    ports:
      - "8082:8080"
    volumes:
      - node2-data:/data

  node-3:
    build: .
    environment:
      - NODE_ID=3
      - PEERS=node-0:9000,node-1:9000,node-2:9000,node-4:9000
      - RPC_PORT=9000
      - WS_PORT=8080
      - DATA_DIR=/data
    ports:
      - "8083:8080"
    volumes:
      - node3-data:/data

  node-4:
    build: .
    environment:
      - NODE_ID=4
      - PEERS=node-0:9000,node-1:9000,node-2:9000,node-3:9000
      - RPC_PORT=9000
      - WS_PORT=8080
      - DATA_DIR=/data
    ports:
      - "8084:8080"
    volumes:
      - node4-data:/data

volumes:
  node0-data:
  node1-data:
  node2-data:
  node3-data:
  node4-data: