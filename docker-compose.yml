services:
  node-1:
    build: .  
    environment:
      - NODE_ID=1
      - PEERS=node-2:9000,node-3:9000,node-4:9000,node-5:9000
      - RPC_PORT=9000
      - WS_PORT=8080
    ports:
      - "8081:8080"
    volumes:
      - node1-data:/data

  node-2:
    build: .
    environment:
      - NODE_ID=2
      - PEERS=node-1:9000,node-3:9000,node-4:9000,node-5:9000
