      - WS_PORT=8080
    ports:
      - "8083:8080"
    volumes:
      - node3-data:/data

  node-4:
    build: .
    environment:
      - NODE_ID=4
      - PEERS=node-1:9000,node-2:9000,node-3:9000,node-5:9000
      - RPC_PORT=9000
      - WS_PORT=8080
    ports:
      - "8084:8080"
    volumes:
      - node4-data:/data

  node-5:
    build: .
